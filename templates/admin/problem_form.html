{% extends "base.html" %}
{% block title %}{{ 'Edit' if problem else 'New' }} Problem — CodeBench{% endblock %}
{% block content %}
<h5 class="mb-3">{{ 'Edit Problem' if problem else 'New Problem' }}</h5>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" action="{{ '/admin/problems/' + problem.id|string + '/edit' if problem else '/admin/problems/new' }}">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required
               value="{{ problem.title if problem else '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="10" required
                  style="font-family: monospace;">{{ problem.description if problem else '' }}</textarea>
        <div class="form-text">Plain text. You can use newlines for formatting.</div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Difficulty</label>
          <select name="difficulty" class="form-select">
            <option value="easy"   {% if problem and problem.difficulty.value == 'easy'   %}selected{% endif %}>Easy</option>
            <option value="medium" {% if not problem or problem.difficulty.value == 'medium' %}selected{% endif %}>Medium</option>
            <option value="hard"   {% if problem and problem.difficulty.value == 'hard'   %}selected{% endif %}>Hard</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Time Limit (ms)</label>
          <input type="number" name="time_limit_ms" class="form-control" min="100" max="30000"
                 value="{{ problem.time_limit_ms if problem else 1000 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Memory Limit (MB)</label>
          <input type="number" name="memory_limit_mb" class="form-control" min="16" max="1024"
                 value="{{ problem.memory_limit_mb if problem else 256 }}">
        </div>
      </div>

      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_visible" id="isVisible"
                 {% if not problem or problem.is_visible %}checked{% endif %}>
          <label class="form-check-label" for="isVisible">Visible to users</label>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">{{ 'Save Changes' if problem else 'Create Problem' }}</button>
        <a href="/admin/problems" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
