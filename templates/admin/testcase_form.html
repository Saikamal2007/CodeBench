{% extends "base.html" %}
{% block title %}{{ 'Edit' if tc else 'New' }} Test Case — CodeBench{% endblock %}
{% block content %}
<h5 class="mb-1">{{ 'Edit Test Case' if tc else 'New Test Case' }}</h5>
<p class="text-muted mb-3">Problem: <strong>{{ problem.title }}</strong></p>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post"
          action="{{ '/admin/testcases/' + tc.id|string + '/edit' if tc else '/admin/problems/' + problem.id|string + '/testcases/new' }}">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Input <span class="text-muted small">(leave blank if no input)</span></label>
          <textarea name="input" class="form-control" rows="6"
                    style="font-family: monospace;">{{ tc.input if tc else '' }}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Expected Output <span class="text-danger">*</span></label>
          <textarea name="expected_output" class="form-control" rows="6" required
                    style="font-family: monospace;">{{ tc.expected_output if tc else '' }}</textarea>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Order Index</label>
          <input type="number" name="order_index" class="form-control" min="0"
                 value="{{ tc.order_index if tc else 0 }}">
          <div class="form-text">Lower numbers appear first.</div>
        </div>
        <div class="col-md-6 d-flex align-items-center mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_sample" id="isSample"
                   {% if tc and tc.is_sample %}checked{% endif %}>
            <label class="form-check-label" for="isSample">
              Sample test case <small class="text-muted">(visible to users on problem page)</small>
            </label>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">{{ 'Save Changes' if tc else 'Add Test Case' }}</button>
        <a href="/admin/problems/{{ problem.id }}/testcases" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
